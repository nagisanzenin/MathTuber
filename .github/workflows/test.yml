name: test
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pip install numpy soundfile
      - run: python tests/integration_speech_headroom.py
      - run: python tests/integration_audio_review.py
      - run: python -m compileall -q plugins scripts tests
